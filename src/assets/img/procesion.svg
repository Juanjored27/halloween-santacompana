<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Procesion de animas encapuchadas con cirios entre la niebla">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08050f"/><stop offset=".42" stop-color="#1a1030"/>
      <stop offset=".72" stop-color="#2b1a44"/><stop offset="1" stop-color="#0a0611"/>
    </linearGradient>
    <radialGradient id="moonHalo">
      <stop offset="0" stop-color="#e7ecff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#9fb0da" stop-opacity=".13"/>
      <stop offset="1" stop-color="#9fb0da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candle">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#ffb54d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160f23"/><stop offset="1" stop-color="#06040b"/>
    </linearGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur9"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="anima">
      <path d="M0 -150 C-30 -150 -46 -100 -46 -46 C-46 0 -58 34 -66 64 L66 64 C58 34 46 0 46 -46 C46 -100 30 -150 0 -150 Z" fill="#0a0712"/>
      <path d="M-16 -118 C-28 -92 -30 -54 -28 -20 C-12 -30 -5 -54 -3 -82 C-2 -100 -8 -114 -16 -118 Z" fill="#201534" opacity=".9"/>
      <ellipse cx="-7" cy="-70" rx="15" ry="23" fill="#03020a"/>
      <rect x="30" y="-14" width="8" height="40" rx="4" fill="#e4dcc8"/>
      <ellipse cx="34" cy="-26" rx="6" ry="12" fill="#ffe1a3"/>
      <circle cx="34" cy="-26" r="46" fill="url(#candle)"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.6" opacity=".7"/><circle cx="320" cy="150" r="1.2" opacity=".5"/>
    <circle cx="480" cy="70" r="1.8" opacity=".75"/><circle cx="700" cy="120" r="1.3" opacity=".55"/>
    <circle cx="760" cy="60" r="1.6" opacity=".6"/><circle cx="1090" cy="110" r="1.4" opacity=".6"/>
    <circle cx="240" cy="250" r="1.2" opacity=".4"/><circle cx="620" cy="220" r="1.4" opacity=".45"/>
    <circle cx="900" cy="60" r="1.2" opacity=".5"/><circle cx="60" cy="200" r="1.3" opacity=".45"/>
  </g>

  <circle cx="960" cy="170" r="240" fill="url(#moonHalo)"/>
  <circle cx="960" cy="170" r="56" fill="#eef1ff" opacity=".9"/>
  <circle cx="944" cy="156" r="11" fill="#d5dcf2" opacity=".55"/>
  <circle cx="976" cy="188" r="15" fill="#d5dcf2" opacity=".4"/>

  <path d="M0 500 L150 430 L280 495 L400 445 L520 500 L660 455 L790 505 L920 460 L1040 500 L1120 470 L1200 505 L1200 800 L0 800 Z" fill="#100a1c"/>
  <path d="M170 470 L170 372 L186 336 L202 372 L202 470 Z" fill="#0a0614"/>
  <path d="M186 336 L186 320 M178 328 L194 328" stroke="#0a0614" stroke-width="4"/>

  <path d="M0 592 C 300 566 900 566 1200 592 L1200 800 L0 800 Z" fill="url(#ground)"/>

  <use href="#anima" transform="translate(300,600) scale(.5)" opacity=".45"/>
  <use href="#anima" transform="translate(830,600) scale(.55)" opacity=".5"/>
  <use href="#anima" transform="translate(750,606) scale(.68)" opacity=".7"/>
  <use href="#anima" transform="translate(660,610) scale(.8)"/>
  <use href="#anima" transform="translate(556,614) scale(.95)"/>
  <use href="#anima" transform="translate(430,618) scale(1.12)"/>

  <g filter="url(#blur18)" opacity=".22">
    <ellipse cx="600" cy="596" rx="640" ry="46" fill="#9fb0da"/>
    <ellipse cx="380" cy="668" rx="420" ry="40" fill="#8fa4cf"/>
    <ellipse cx="940" cy="650" rx="360" ry="34" fill="#8fa4cf"/>
  </g>
  <g filter="url(#blur9)" opacity=".12">
    <ellipse cx="520" cy="520" rx="380" ry="26" fill="#cfd8f5"/>
    <ellipse cx="900" cy="470" rx="300" ry="20" fill="#cfd8f5"/>
  </g>

  <path d="M60 800 L60 700 M60 726 L40 706 M60 712 L82 692" stroke="#05030a" stroke-width="9" stroke-linecap="round"/>
  <path d="M1140 800 L1140 690 M1140 720 L1118 700 M1140 704 L1164 686" stroke="#05030a" stroke-width="7" stroke-linecap="round"/>
  <path d="M0 770 C 200 750 340 790 560 772 C 780 754 940 792 1200 768 L1200 800 L0 800 Z" fill="#05030a"/>
</svg>
